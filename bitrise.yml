format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: react-native

app:
  envs:
    - GRADLE_BUILD_FILE_PATH: android/build.gradle
    - GRADLEW_PATH: android/gradlew
    - BITRISE_PROJECT_PATH: android
    - ANDROID_MODULE: app
    - ANDROID_VARIANT: release

workflows:
  test:
    summary: Install dependencies and run Jest tests
    description: Installs npm dependencies and runs the project test suite.
    steps:
      - git-clone@8: {}
      - restore-npm-package-manager-cache@1: {}
      - npm@1:
          title: npm install
          inputs:
            - command: install
      - save-npm-package-manager-cache@1: {}
      - npm@1:
          title: Run tests
          inputs:
            - command: test -- --watchAll=false --passWithNoTests

  build-android:
    summary: Build a signed Android APK/AAB
    description: Installs dependencies and assembles a release Android build.
    steps:
      - git-clone@8: {}
      - restore-npm-package-manager-cache@1: {}
      - npm@1:
          title: npm install
          inputs:
            - command: install
      - save-npm-package-manager-cache@1: {}
      - install-missing-android-tools@3:
          inputs:
            - gradlew_path: $GRADLEW_PATH
      - android-build@1:
          inputs:
            - project_location: $BITRISE_PROJECT_PATH
            - module: $ANDROID_MODULE
            - variant: $ANDROID_VARIANT
            - build_type: apk
      - sign-apk@1:
          run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
          inputs:
            - android_app: $BITRISE_APK_PATH
      - deploy-to-bitrise-io@2: {}

  ci:
    summary: Run tests then build Android
    description: Full CI pipeline — test first, then produce an Android build.
    before_run:
      - test
    after_run:
      - build-android
